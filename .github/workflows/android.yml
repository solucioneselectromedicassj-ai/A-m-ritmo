name: APK Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Aceptar licencias del SDK de Android (ya viene instalado en el runner)
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - name: Instalar dependencias y copiar la web
        run: |
          npm ci
          node scripts/build-web.js
          npx cap sync android
      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: a-mi-ritmo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK en Releases (para bajarlo desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk a-mi-ritmo.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest a-mi-ritmo.apk --prerelease --target "$GITHUB_SHA" \
            --title "A Mi Ritmo (APK de prueba)" \
            --notes "APK debug de la rama $GITHUB_REF_NAME, commit ${GITHUB_SHA::7}. Instalar con permiso de apps desconocidas."
