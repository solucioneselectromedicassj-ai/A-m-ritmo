<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d63f1f">
<meta name="description" content="Tu plan de hábitos de salud: ejercicio, agua, alimentación y mediciones, a tu medida.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>A Mi Ritmo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" role="dialog" aria-label="Bienvenida a A Mi Ritmo">
  <div class="sp-in">
    <svg class="sp-logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset=".55" stop-color="#f0485a"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
      <rect width="512" height="512" rx="120" fill="url(#spg)"/>
      <path class="sp-pulso" pathLength="100" d="M88 290 H176 L212 196 L270 352 L318 244 H356" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="sp-punto" cx="404" cy="244" r="26" fill="#fff"/>
    </svg>
    <div class="sp-nombre">A Mi Ritmo</div>
    <div class="sp-lema">Tu plan, a tu manera.</div>

    <small class="sp-toque">Tocá para continuar</small>
  </div>
</div>
<header class="top">
  <h1>A Mi Ritmo</h1>
  <span id="topDate" class="muted"></span>
</header>

<main id="view" aria-live="polite"></main>

<aside id="anuncio" aria-label="Espacio publicitario de ejemplo" hidden><span>Espacio publicitario</span><small>pendiente de aprobación · AdMob</small></aside>
<nav id="nav" aria-label="Secciones"></nav>

<div id="timer" hidden>
  <div><small id="timerLabel"></small><b id="timerTime">0:00</b></div>
  <button data-a="timer-stop" aria-label="Detener temporizador">✕</button>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toast" role="status"></div>
<div id="informe"></div>

<script src="figuras.js"></script>
<script src="app.js"></script>
</body>
</html>
